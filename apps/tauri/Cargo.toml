[package]
name = "chatovo"
version = "0.0.0"
description = "Chatovo desktop client"
authors = ["Chatovo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Gradle wiring the Tauri CLI applies while generating gen/android, so the setup
# scripts do not have to patch the build files by hand. Only what has no hook
# here is still patched: the VK maven repositories, MainActivity, the proguard
# rules and google-services.json.
[package.metadata.cargo-android]
app-plugins = ["com.google.gms.google-services"]
project-dependencies = ["com.google.gms:google-services:4.4.2"]
app-dependencies = ["ru.rustore.sdk:appupdate:10.5.1"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chatovo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fcm = "0.2"
tauri-plugin-safe-area-insets-css = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"


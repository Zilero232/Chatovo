name: deploy

# Builds the two images, pushes them to ghcr, then tells the VPS to pull and
# restart. The VPS holds no clone of the repository — only docker-compose.yml,
# a hand-written .env and livekit.yaml — so the compose file is copied on every
# deploy.
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL       baked into the web image at build time
#   NEXT_PUBLIC_LIVEKIT_URL   likewise
#   SSH_HOST                  production VPS
#   SSH_USER
#   SSH_PRIVATE_KEY           private key used for scp + ssh
#   SSH_PORT                  optional, defaults to 22
#   DEPLOY_PATH               where docker-compose.yml lives, e.g. /opt/chatovo
#
# Actions are pinned to a commit SHA, not a tag: a moved tag would run unknown
# code against the production host. Bumping them is a manual edit — the comment
# next to each SHA says which release it is.

# Manual only: production goes out when someone decides it does, not on every
# commit that lands. Run it from Actions → deploy → Run workflow, on a commit
# whose release checks are already green.
on:
  workflow_dispatch:

# Never cancel a half-finished deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

# The docker builds carry their own placeholders, but a `bun install` added here
# later would fire the server postinstall, and prisma.config.ts resolves
# DIRECT_URL through env(). Cheap insurance.
env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

permissions: {}

jobs:
  images:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ghcr rejects an image name with capitals, and the owner has them.
      - name: Lowercase the image prefix
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/chatovo-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/chatovo-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  vps:
    needs: images

    permissions:
      contents: read

    # Attach protection rules and scope the deploy secrets to this environment.
    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      # The path travels as an env var rather than being interpolated into the
      # script — expression interpolation inside a shell body is how injection
      # gets in.
      # Migrations run inside the freshly pulled server image, before the new
      # code serves traffic — a container started against an un-migrated schema
      # crashes on the first query touching a new column.
      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            docker compose pull web server
            docker compose run --rm --no-deps server bun db:deploy
            docker compose up -d
            docker image prune -f

            # `up -d` returns as soon as the container is started, not once the
            # app inside answers. Reaching straight for `exec` hits the
            # container mid-restart: "is restarting, wait until the container is
            # running". The compose healthcheck already knows when the API is up.
            for attempt in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' chatovo-server 2>/dev/null || echo missing)

              [ "$state" = healthy ] && break

              if [ "$attempt" = 30 ]; then
                echo "server never became healthy (last state: $state)" >&2
                docker compose logs --tail 50 server >&2
                exit 1
              fi

              sleep 5
            done

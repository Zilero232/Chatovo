name: release

# Tauri cannot cross-compile, so every platform builds on its own runner.
# tauri-action creates the draft once and merges each platform's entry into a
# single latest.json — hence no hand-rolled updater manifest here.
#
# Secrets — Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_API_URL              baked into every bundle, e.g. https://api.chatovo.ru
#   NEXT_PUBLIC_LIVEKIT_URL          likewise, e.g. wss://livekit.chatovo.ru
#   TAURI_SIGNING_PRIVATE_KEY        contents of ~/.tauri/chatovo.key
#                                    (bun --filter @chatovo/tauri signer:generate)
#   ANDROID_KEY_ALIAS                keystore alias
#   ANDROID_KEY_PASSWORD             keystore + key password
#   ANDROID_KEY_BASE64               the keystore itself, base64
#
# The keystore is generated once, by hand, and never regenerated — a new key
# cannot update an APK that is already installed:
#   keytool -genkey -v -keystore chatovo-release.keystore -alias chatovo \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -i chatovo-release.keystore
#
# GITHUB_TOKEN is provided by Actions; nothing to add for it.
#
# Actions are pinned to a commit SHA, not a tag: a tag can be moved, and these
# jobs hold the signing keys. Bumping them is a manual edit — the comment next
# to each SHA says which release it is.

# The gate is the `checks` job below rather than a chained workflow:
# `workflow_run` cannot filter on a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every `bun install` fires the server postinstall, and prisma.config.ts
# resolves DIRECT_URL through env(). `generate` never connects.
env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

# Granted per job: only the ones touching the release need write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate: nothing below runs unless it passes, so a tag on a commit that
  # does not typecheck never produces signed artefacts.
  checks:
    # The root `permissions: {}` strips every scope; the clone needs this back.
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The root package.json is the single source of truth for the version;
      # per-app manifests stay at 0.0.0.
      - name: Check the tag matches the version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          root=$(node -p "require('./package.json').version")

          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$root" ]; then
            echo "tag $REF_NAME does not match root package.json version $root" >&2
            exit 1
          fi

          echo "releasing v$root"

      - uses: ./.github/actions/setup
        with:
          cache-key: verify

      # tauri links against webkit2gtk; clippy cannot build without these.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # frontendDist is validated at build time, so the icons and the exported
      # client must exist before clippy touches the crate.
      - run: bun run tauri:icon

      # Nothing built here ships, so placeholders keep the checks runnable on a
      # fork with no secrets.
      - env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.invalid
          NEXT_PUBLIC_LIVEKIT_URL: wss://livekit.invalid
        run: bun --filter @chatovo/client build

      - run: bun run verify
      - run: bun run test
      - run: bun run lint:rust

  # Created up front so desktop and android upload in parallel.
  draft:
    needs: checks

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"

          gh release view "$tag" >/dev/null 2>&1 && exit 0

          gh release create "$tag" --draft --target "$COMMITISH" \
            --title "Chatovo $tag" --notes ""

  desktop:
    needs: draft

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
            args: ''
          # Separate bundles per arch: the updater keys its platforms on it.
          - os: macos-15
            label: macos-aarch64
            args: --target aarch64-apple-darwin
          - os: macos-15
            label: macos-x86_64
            args: --target x86_64-apple-darwin
          - os: ubuntu-24.04
            label: linux
            args: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.label }}
          # rust-toolchain.toml only names the windows target.
          rust-targets: ${{ matrix.label == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.label == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # tauri-action builds the client itself; icons are the one input it does
      # not generate.
      - run: bun run tauri:icon

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/tauri
          tagName: v__VERSION__
          releaseName: Chatovo v__VERSION__
          # Stays a draft until Android has uploaded too; `publish` flips it.
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: draft

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `cache: gradle`: it hashes **/*.gradle*, which does not exist yet —
      # `tauri android init` generates gen/android later in this job.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/tauri/Cargo.toml', 'apps/tauri/scripts/setup-android-fcm.mjs') }}
          restore-keys: gradle-

      # build-tools is not part of the default package set, and without it
      # there is no apksigner to verify the signed apk with.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools build-tools;34.0.0

      # setup-android ships the SDK but not the NDK, and without it cargo
      # cannot cross-compile to the android targets.
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: ./.github/actions/setup
        with:
          cache-key: android
          rust-targets: aarch64-linux-android x86_64-linux-android

      # `tauri android init` regenerates gen/android, so the FCM overlay and
      # the signing config are applied after it, never before.
      - name: Prepare the android project
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bunx tauri android init
          bun run icon
          node ./scripts/setup-android-fcm.mjs

      - name: Wire release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: node apps/tauri/scripts/android-signing.mjs

      - name: Build apk and aab
        working-directory: apps/tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
        run: |
          bunx tauri android build --apk --target aarch64 --target x86_64
          bunx tauri android build --aab --target aarch64 --target x86_64

      # The universal build is the one that ships; gradle also leaves per-ABI
      # artifacts next to it.
      - name: Collect and verify
        id: artifacts
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gen=apps/tauri/gen/android
          apk=$(find "$gen" -path '*/outputs/*' -name '*universal*release*.apk' | head -1)
          aab=$(find "$gen" -path '*/outputs/*' -name '*release*.aab' | head -1)

          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "apk or aab missing under $gen" >&2
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --verbose "$apk"

          mkdir -p target/android-release
          cp "$apk" "target/android-release/Chatovo_${version}_android.apk"
          cp "$aab" "target/android-release/Chatovo_${version}_android.aab"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.artifacts.outputs.tag }}
        run: gh release upload "$TAG" target/android-release/* --clobber

  publish:
    needs: [desktop, android]
    # The desktop bundles should still ship if the Android build failed.
    if: always() && needs.desktop.result == 'success'

    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          gh release edit "$tag" --draft=false --latest

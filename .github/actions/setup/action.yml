name: Setup toolchain
description: Bun, the pinned Rust toolchain and the caches every job in this repo needs.

inputs:
  cache-key:
    description: Suffix that keeps the Rust cache separate per platform or job.
    required: true
  rust-targets:
    description: Extra rustup targets, space separated.
    required: false
    default: ''

runs:
  using: composite

  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.1

    # rust-toolchain.toml is the single source of the version, the components
    # and the targets; `rustup show` installs exactly what it names.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        rustup show
        if [ -n "${{ inputs.rust-targets }}" ]; then
          rustup target add ${{ inputs.rust-targets }}
        fi

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: apps/tauri
        key: ${{ inputs.cache-key }}
        cache-on-failure: true

    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # The server's postinstall runs `prisma generate`, and prisma.config.ts
    # resolves DIRECT_URL through env(), which throws when unset. `generate`
    # never connects, so a placeholder satisfies it — the same trick the
    # Dockerfiles use.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile
